# Gate: fail the check when project coverage drops below 95% (spec decision 2026-08-12).
coverage:
  status:
    project:
      default:
        target: 95%
    patch:
      default:
        target: 95%

# Wiring-only files executed by the eve runtime at startup, not unit-testable,
# test support, and the entry point of `pnpm connect`.
# Must mirror the coverage.exclude list in vitest.config.ts.
ignore:
  - "agent/agent.ts"
  - "agent/instrumentation/**"
  - "agent/channels/**"
  - "agent/extensions/**"
  - "agent/hooks/**"
  - "agent/tools/**"
  - "scripts/connect.ts"
  - "**/*.fixtures.ts"
  - "**/*.test.ts"
