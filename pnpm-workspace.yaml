# pnpm's default minimumReleaseAge (1 day) applies. Renovate reads it and the
# exclusions below (minimumReleaseAgePackageManagerSync in renovate.json), so
# it never proposes an update this rule would refuse.
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
allowBuilds:
  braintrust: true
  esbuild: true
  sharp: false
