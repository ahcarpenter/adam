name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the Codecov upload authenticates with CODECOV_TOKEN,
# not GITHUB_TOKEN. Widen per job if a step ever needs to write.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (biome ci)
        run: pnpm lint:ci

      - name: Format check (prettier)
        run: pnpm exec prettier --check "**/*.{md,yml,yaml,css}"

      - name: Typecheck
        run: pnpm typecheck

      # tsc does not run eve's compiler, so extension contract breaks, tool
      # discovery errors, and bundler failures are invisible to every other
      # step here — a dependency bump can pass CI and fail only at deploy.
      # The values are placeholders: agent.ts validates the environment at
      # module load, which discovery triggers, but nothing connects during a
      # build.
      - name: Build (eve compile + bundle)
        run: pnpm build
        env:
          OPENAI_API_KEY: sk-ci
          OPENAI_MODEL: gpt-5
          UPSTASH_REDIS_REST_URL: https://ci.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-token
          BRAINTRUST_API_KEY: ci-key
          POSTHOG_PROJECT_TOKEN: phc_ci

      - name: Dead code
        run: pnpm knip

      - name: Tests with coverage
        run: pnpm test:coverage

      # The 95% project/patch gate in codecov.yml activates once the
      # CODECOV_TOKEN repository secret is set; until then the upload fails
      # softly and no coverage status check is reported.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
